name: Build Kasbyar Kotlin APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest


steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check Android SDK
    run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      find "$ANDROID_HOME" -name sdkmanager -type f

  - name: Install Android SDK packages
    run: |
      SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      yes | "$SDKMANAGER" --licenses > /dev/null || true
      "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract Kotlin project
    run: |
      rm -rf kasbyar_project
      mkdir -p kasbyar_project
      unzip -o KasbyarKotlin.zip -d kasbyar_project

      if [ -f kasbyar_project/settings.gradle ] || [ -f kasbyar_project/settings.gradle.kts ]; then
        echo "Project files are already at the root."
      else
        INNER_DIR=$(find kasbyar_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
        echo "Moving project from: $INNER_DIR"
        cp -a "$INNER_DIR"/. kasbyar_project/
      fi

  - name: Verify Gradle project
    working-directory: kasbyar_project
    run: |
      echo "Project root:"
      pwd
      echo "Files:"
      ls -la
      test -f settings.gradle || test -f settings.gradle.kts

  - name: Build APK
    working-directory: kasbyar_project
    run: |
      gradle assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Kasbyar-APK
      path: kasbyar_project/app/build/outputs/apk/debug/app-debug.apk
```
